- module: spec/ladder/reduce/LabelsOffDown.tla
  level: 3
  reduction: spec/ladder/reduce/LabelsOffDown.tla
- module: spec/ladder/reduce/LabelsOffUp.tla
  level: 3
  reduction: spec/ladder/reduce/LabelsOffUp.tla
- module: spec/ladder/reduce/ProbeOffDown.tla
  level: 3
  reduction: spec/ladder/reduce/ProbeOffDown.tla
- module: spec/ladder/reduce/ProbeOffUp.tla
  level: 3
  reduction: spec/ladder/reduce/ProbeOffUp.tla
- module: spec/ladder/reduce/ProgressOffDown.tla
  level: 3
  reduction: spec/ladder/reduce/ProgressOffDown.tla
- module: spec/ladder/reduce/ProgressOffUp.tla
  level: 3
  reduction: spec/ladder/reduce/ProgressOffUp.tla
- module: spec/ladder/reduce/ReconcileR3OffDown.tla
  level: 3
  reduction: spec/ladder/reduce/ReconcileR3OffDown.tla
- module: spec/ladder/reduce/ReconcileR3OffUp.tla
