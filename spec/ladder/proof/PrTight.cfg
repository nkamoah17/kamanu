\* R9, TLC sanity check of the tightness candidate on one bounded cell (not the
\* proof): as PrRefine.cfg with HasReconcile = FALSE (with it, a refund leaves the
\* request in the history and ViewTight FAILS: evidence/ladder/r1/grid.json, R2).
CONSTANTS
    MaxReq = 3
    MaxFails = 1
    Cap = 100
    LAmts = {30, 60}
    Reflexive = TRUE
    DenyRecord = "none"
    Atomic = TRUE
    Lag = 0
    Faults = {"clean", "ambiguous"}
    HasReconcile = FALSE
    Templates <- RiTemplates
    Permit <- RiPermit
    Scope <- RiScope
SPECIFICATION RiSpec
INVARIANT RiTightInv
INVARIANT RiViewTight
PROPERTY RiRefines
PROPERTY RiNoFalseRefusal
