\* T6, the $500-a-day demo. Engine's session-scoped limit: the cap counts each session alone. Sound FAILS.
\* One tenant, principal and purpose open three sessions on one day; each call asks $300.
\* Money in cents. Two calls in flight and a retry (MaxReq = 3), one failure, clean or ambiguous.
SPECIFICATION BudgetSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Templates <- DemoTemplates
  Permit <- PRefundOnReconcile
  Scope <- ScopeSessionOnly
  Sessions = {"s1", "s2", "s3"}
  Tenants = {"acme"}
  Principals = {"agent-7"}
  Purposes = {"procurement"}
  Windows = {"2026-11-23"}
  Cap = 50000
  MaxReq = 3
  MaxFails = 1
  Faults = {"clean", "ambiguous"}
  HasReconcile = TRUE
  Reflexive = TRUE
  DenyRecord = "none"
  Atomic = TRUE
  Lag = 0
INVARIANT BudgetTypeOK
INVARIANT DemoSound

