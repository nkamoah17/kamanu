[package]
name = "dogwood-local-harness"
version = "0.1.0"
edition = "2024"
publish = false
description = "KAMANU H5: the Dogwood Local Engine behind a JSON-lines protocol on stdin/stdout."
license = "Apache-2.0"

[[bin]]
name = "dogwood-local-harness"
path = "src/main.rs"

[dependencies]
# The library under test, at a git rev Cargo.lock pins. Sums over a window are
# arithmetic, which the frontend keeps behind its experimental-arithmetic feature.
dogwood-local-engine = { git = "https://github.com/dogwood-policy/dogwood-local-engine", rev = "7a73acc6a8418fa16241294ccd5630dc6edbbcc0", features = ["experimental-arithmetic"] }
# The language crate at the rev the library itself depends on (one copy in the graph).
dogwood-language = { git = "https://github.com/dogwood-policy/dogwood", rev = "4ec5e2c01b44ff3882a231ae5d315b330b38fa25", features = ["experimental-arithmetic"] }
serde_json = "1"
