\* R9, TLC sanity check of the candidate on one bounded cell (not the proof):
\* PReqBasis, reflexive, Atomic, Lag 0, DenyRecord "none", faults R2, HasReconcile.
CONSTANTS
    MaxReq = 3
    MaxFails = 1
    Cap = 100
    LAmts = {30, 60}
    Reflexive = TRUE
    DenyRecord = "none"
    Atomic = TRUE
    Lag = 0
    Faults = {"clean", "ambiguous"}
    HasReconcile = TRUE
    Templates <- RiTemplates
    Permit <- RiPermit
    Scope <- RiScope
SPECIFICATION RiSpec
INVARIANT RiInv
PROPERTY RiRefines
