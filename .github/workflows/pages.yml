name: pages
# The site: pages/ at the root, the signed registry at /record/. Enable once in Settings, Pages,
# Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["pages/**", "registry/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: assemble the site and check the record it serves
        run: |
          bash pages/build.sh _site
          for p in _site/record/h/*.html; do node _site/record/kamanu-verify.cjs "$p" "$(cat _site/record/registry.pub)"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
