- module: spec/ext/Storm.tla
  standalone: 'the retry-storm model (K12, kamanu check''s storm line): its own ages and variables, no kernel module'
- module: spec/ext/HuntFreeze.tla
  standalone: 'the hunt''s freeze model (H2): one agent over ages, its own variables, no kernel module'
- module: spec/demos/Handoff.tla
  illustration: a two-agent handoff demo over its own variables; no kernel step, read by no gate's product
- module: spec/demos/Interrupt.tla
  illustration: an interruption demo over its own variables; no kernel step, read by no gate's product
- module: spec/demos/Recruit.tla
  illustration: a recruiting-pipeline demo over its own variables; no kernel step, read by no gate's product
- module: spec/demos/Wallet.tla
  illustration: a two-agent wallet demo on the kernel's own variables and steps; read only by demo gates
# R4: staleness counted in calls. Its reduction to the kernel is the stated mapping from each
# (Atomic, Lag) profile to (Atomic, OwnWrites, OtherLag), checked by TLC on R1's 40 single-mark
# cells (kamanu/ladder/staleness.py; evidence/ladder/r4/mapping.json): the Lag-0 profiles map to
# OwnWrites TRUE, OtherLag 0 exactly (equal view sets). SeqWriter is Staleness with one
# sequential writer per key (evidence/ladder/r4/seqwriter.json).
- module: spec/ladder/Staleness.tla
  level: 3
  reduction: spec/ladder/Staleness.tla
- module: spec/ladder/SeqWriter.tla
  level: 3
  reduction: spec/ladder/Staleness.tla
# R9: towards proof. PrKernel is the kernel seed with Apalache type annotations (comments to
# TLC; listed in evidence/ladder/r9/annotations.json), PrLedger the ledger renamed, PrRefine the
# candidate invariant and the refinement and tightness obligations (TLC: PrRefine.cfg,
# PrTight.cfg). PrKernelFold / PrRefineFold are the same in a form Apalache reads; the Pr*Ap
# modules are the Apalache harnesses (evidence/ladder/r9/run.py, summary.json, blocker.md).
- module: spec/ladder/proof/PrKernel.tla
  level: 2
  reduction: spec/ladder/proof/PrRefine.tla
- module: spec/ladder/proof/PrLedger.tla
  level: 2
  reduction: spec/ladder/proof/PrRefine.tla
- module: spec/ladder/proof/PrRefine.tla
  level: 2
  reduction: spec/ladder/proof/PrRefine.tla
- module: spec/ladder/proof/PrKernelFold.tla
  level: 2
  reduction: spec/ladder/proof/PrRefineFold.tla
- module: spec/ladder/proof/PrRefineFold.tla
  level: 2
  reduction: spec/ladder/proof/PrRefineFold.tla
- module: spec/ladder/proof/PrRefineAp.tla
  level: 2
  reduction: spec/ladder/proof/PrRefine.tla
- module: spec/ladder/proof/PrFoldAp.tla
  level: 2
  reduction: spec/ladder/proof/PrRefineFold.tla
- module: spec/ladder/proof/PrFoldApReq.tla
  level: 2
  reduction: spec/ladder/proof/PrRefineFold.tla
- module: spec/ladder/proof/PrFoldApBounded.tla
  level: 2
  reduction: spec/ladder/proof/PrRefineFold.tla
# R12: the coach and the reconciling harness as agent moves of R7's fix module. LadderCoach
# EXTENDS LadderFix (written beside spec/ by kamanu/ladder/fix.py for each agent-cell TLC run;
# kamanu/ladder/coachmodel.py) and is checked by TLC per agent cell with R7's FSpendOK,
# FSoundAdmit, FNoFalseRefusal and FNoPaid (evidence/ladder/r12/agent.json).
- module: spec/ladder/coach/LadderCoach.tla
  level: 3
  reduction: spec/ladder/coach/LadderCoach.tla
# R16c: the ledgers of record for rules without money (kamanu check on a flag or latch policy;
# kamanu/ledgers/check.py). Each extends WindowKernel with a ghost truth that constrains no kernel
# step, so each reduces to WindowKernel with a history variable restating truth.
- module: spec/ledgers/Latch.tla
  level: 3
  reduction:
    name: LatchOff
    spec_module: spec/ledgers/Latch.tla
    spec: LSpec
    target: spec/ext/WindowKernel.tla
    target_spec: Spec
    feature_off: 'nothing to switch: truth is a ghost that constrains no kernel step'
- module: spec/ledgers/Prerequisite.tla
  level: 3
  reduction:
    name: PrerequisiteOff
    spec_module: spec/ledgers/Prerequisite.tla
    spec: LSpec
    target: spec/ext/WindowKernel.tla
    target_spec: Spec
    feature_off: 'nothing to switch: truth is a ghost that constrains no kernel step'
# R16d: the Credit ledger (a register that spans two actions: approvals, tokens, concurrency limits;
# kamanu.fast.credit is lint's machine for it). It declares no variable (its truth reads the kernel's
# own eff, st and rq) and its spec bounds the calls in flight, so it reduces to WindowKernel with
# InFlightMax at the request bound.
- module: spec/ledgers/Credit.tla
  level: 3
  reduction:
    name: CreditOff
    spec_module: spec/ledgers/Credit.tla
    spec: CSpec
    target: spec/ext/WindowKernel.tla
    target_spec: Spec
    feature_off: 'InFlightMax = 3, the request bound MaxReq: no in-flight bound below it; the truth is read, never stored'
    fixed: [InFlightMax]
# X4: the card ledger (authorization, capture, reversal, over-capture and force-post as ledger steps;
# kamanu.fast.card is lint's machine for it). With over-capture and force-post off it is the ledger with
# holds, CardHolds (level 2, under spec/ladder), with the same variables.
- module: spec/ledgers/Card.tla
  level: 3
  reduction:
    name: CardOff
    spec_module: spec/ledgers/Card.tla
    spec: CardSpec
    target: spec/ladder/reduce/CardHolds.tla
    target_spec: HSpec
    feature_off: 'OverCapture = 0 and ForcePost = 0: no capture above its hold, nothing committed without a hold'
    fixed: [OverCapture, ForcePost]
- module: spec/ladder/reduce/CardHolds.tla
  level: 2
  reduction: spec/ladder/reduce/CardHolds.tla
- module: spec/ladder/reduce/CardOffDown.tla
  level: 3
  reduction: spec/ladder/reduce/CardOffDown.tla
- module: spec/ladder/reduce/CardOffUp.tla
  level: 3
  reduction: spec/ladder/reduce/CardOffUp.tla
- module: spec/ladder/reduce/CreditOffDown.tla
  level: 3
  reduction: spec/ladder/reduce/CreditOffDown.tla
- module: spec/ladder/reduce/CreditOffUp.tla
  level: 3
  reduction: spec/ladder/reduce/CreditOffUp.tla
- module: spec/ladder/reduce/LatchOffDown.tla
  level: 3
  reduction: spec/ladder/reduce/LatchOffDown.tla
- module: spec/ladder/reduce/LatchOffUp.tla
  level: 3
  reduction: spec/ladder/reduce/LatchOffUp.tla
- module: spec/ladder/reduce/PrerequisiteOffDown.tla
  level: 3
  reduction: spec/ladder/reduce/PrerequisiteOffDown.tla
- module: spec/ladder/reduce/PrerequisiteOffUp.tla
  level: 3
  reduction: spec/ladder/reduce/PrerequisiteOffUp.tla
- module: spec/ext/Isolation.tla
  standalone: 'the isolation contract (X5): tenants, sessions, records and a connector''s accesses, its own variables bound and given, no kernel module'
# X8: limits that are not windows. Each is its own model over its own variables (decisions, payments moved,
# calls in flight); no kernel module, no kernel step.
- module: spec/ext/Threshold.tla
  standalone: 'the per-payment threshold (X8): decisions, payments moved and calls in flight, its own variables, no kernel module'
- module: spec/ext/Composite.tla
  standalone: 'the most-restrictive composite of a threshold and a window or lifetime cap (X8): its own variables and clock, no kernel module'
