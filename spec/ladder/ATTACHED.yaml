# Rule L5 made total (R3): every .tla under spec/ is attached or labelled.
#   level 1  the ledger, with the file that holds its check
#   level 2  the kernel (seeds, ladder modules), with a spec/ladder module that checks it
#   level 3  a feature, with reduction objects: a TLC refinement both ways, feature off
#            (python -m kamanu.ladder.reduce; evidence/ladder/r3/reductions.json)
#   standalone / illustration  a separate model / a demo no product code reads
modules:
- module: spec/KamanuKernel.tla
  level: 2
  reduction: spec/ladder/LedgerCheck.tla
- module: spec/KamanuAdversary.tla
  level: 2
  reduction: spec/ladder/LedgerCheck.tla
- module: spec/KamanuPolicies.tla
  level: 2
  reduction: spec/ladder/LedgerCheck.tla
- module: spec/MCSafety.tla
  level: 2
  reduction: spec/ladder/LedgerCheck.tla
- module: spec/KamanuTask.tla
  level: 2
  reduction: spec/ladder/LedgerCheck.tla
- module: spec/MCTask.tla
  level: 2
  reduction: spec/ladder/LedgerCheck.tla
- module: spec/ladder/Ledger.tla
  level: 1
  reduction: evidence/ladder/r1/apalache.log
- module: spec/ladder/LedgerCheck.tla
  level: 2
  reduction: spec/ladder/LedgerCheck.tla
- module: spec/ladder/LedgerDS.tla
  level: 2
  reduction: spec/ladder/LedgerDS.tla
- module: spec/ladder/LedgerU.tla
  level: 2
  reduction: spec/ladder/LedgerU.tla
- module: spec/ladder/Actors.tla
  level: 2
  reduction: spec/ladder/Actors.tla
- module: spec/ladder/Undecided.tla
  level: 2
  reduction: spec/ladder/UndecidedCheck.tla
- module: spec/ladder/UndecidedCheck.tla
  level: 2
  reduction: spec/ladder/UndecidedCheck.tla
- module: spec/ext/Unbounded.tla
  level: 2
  reduction: spec/ladder/LedgerCheck.tla
- module: spec/ext/BudgetKey.tla
  level: 3
  reduction:
    name: BudgetKeyOff
    spec_module: spec/ext/BudgetKey.tla
    spec: BudgetSpec
    target: spec/MCSafety.tla
    target_spec: Spec
    feature_off: 'Scope <- ScopeSession (the kernel''s session scope, not ScopeBudget): no ledger is keyed by the budget key'
- module: spec/ladder/reduce/GoalAgent.tla
  level: 2
  reduction: spec/ladder/reduce/GoalAgent.tla
- module: spec/ladder/reduce/MarkedTask.tla
  level: 2
  reduction: spec/ladder/reduce/MarkedTask.tla
- module: spec/ladder/reduce/ProbeKernels.tla
  level: 2
  reduction: spec/ladder/reduce/ProbeKernels.tla
- module: spec/ext/WindowKernel.tla
  level: 3
  reduction:
    name: WindowKernelOff
    spec_module: spec/ext/WindowKernel.tla
    spec: Spec
    target: spec/MCSafety.tla
    target_spec: Spec
    feature_off: 'Window = 0 (no window: the guard sees the whole history)'
    fixed:
    - Window
- module: spec/ext/FalseDenial.tla
  level: 3
  reduction:
    name: FalseDenialOff
    spec_module: spec/ext/FalseDenial.tla
    spec: FDSpec
    target: spec/MCSafety.tla
    target_spec: Spec
    feature_off: 'nothing to switch: fd is a ghost that constrains no kernel step'
- module: spec/ext/DenySet.tla
  level: 3
  reduction:
    name: DenySetOff
    spec_module: spec/ext/DenySet.tla
    spec: DSSpec
    target: spec/ext/FalseDenial.tla
    target_spec: FDSpec
    feature_off: DenyMarks = {"request"}, a singleton, with DenyRecord = "request" its element
    fixed:
    - DenyMarks
    - DenyRecord
- module: spec/ext/Undetermined.tla
  level: 3
  reduction:
  - &id001
    name: UndeterminedSafetyOff
    spec_module: spec/ext/UndeterminedSafety.tla
    spec: USpec
    target: spec/MCSafety.tla
    target_spec: Spec
    feature_off: 'Refuse disabled: the configuration overrides Refuse <- NoRefuse (never enabled)'
    fixed:
    - Refuse
  - &id002
    name: UndeterminedTaskOff
    spec_module: spec/ext/UndeterminedTask.tla
    spec: USpec
    target: spec/MCTask.tla
    target_spec: Spec
    feature_off: 'Refuse disabled: the configuration overrides Refuse <- NoRefuse (never enabled)'
    fixed:
    - Refuse
- module: spec/ext/UndeterminedSafety.tla
  level: 3
  reduction: *id001
- module: spec/ext/UndeterminedTask.tla
  level: 3
  reduction: *id002
- module: spec/ext/Hostile.tla
  level: 3
  reduction:
    name: HostileOff
    spec_module: spec/ext/Hostile.tla
    spec: HSpec
    target: spec/ladder/reduce/MarkedTask.tla
    target_spec: MSpec
    feature_off: AdvMax = 0 (no adversary) and HasTimeout = FALSE (Hostile's harness has no timer)
    fixed:
    - AdvMax
    - HasTimeout
- module: spec/ext/Invalidation.tla
  level: 3
  reduction:
    name: InvalidationOff
    spec_module: spec/ext/Invalidation.tla
    spec: Spec
    target: spec/MCSafety.tla
    target_spec: Spec
    feature_off: MaxChanges = 0 (no policy change)
    fixed:
    - MaxChanges
- module: spec/ext/Labels.tla
  level: 3
  reduction:
    name: LabelsOff
    spec_module: spec/ext/Labels.tla
    spec: Spec
    target: spec/KamanuAdversary.tla
    target_spec: Spec
    feature_off: HasReconcile = FALSE (Labels has no Reconcile step); its label policy and scope are the kernel's
      Permit and Scope
    fixed:
    - HasReconcile
- module: spec/ext/Progress.tla
  level: 3
  reduction:
    name: ProgressOff
    spec_module: spec/ext/Progress.tla
    spec: PSpec
    target: spec/MCTask.tla
    target_spec: Spec
    feature_off: Fixed = FALSE (the seed's untimed timer; the clock then gates nothing)
    fixed:
    - Fixed
- module: spec/ext/ReconcileR3.tla
  level: 3
  reduction:
    name: ReconcileR3Off
    spec_module: spec/ext/ReconcileR3.tla
    spec: Spec
    target: spec/ladder/reduce/GoalAgent.tla
    target_spec: AgentSpec
    feature_off: 'Fixed = FALSE (the rotating schedule: no slot is handed over, an unknown answer moves no kernel
      variable)'
    fixed:
    - Fixed
- module: spec/ext/ReconcileR3b.tla
  level: 3
  reduction:
    name: ReconcileR3bOff
    spec_module: spec/ext/ReconcileR3b.tla
    spec: Spec
    target: spec/MCSafety.tla
    target_spec: Spec
    feature_off: 'RLag = 0 and Agree = 1 (records never lag: every first answer is final and resolves)'
    fixed:
    - RLag
    - Agree
- module: spec/ext/Window.tla
  level: 3
  reduction:
    name: WindowOff
    spec_module: spec/ext/Window.tla
    spec: Spec
    target: spec/MCSafety.tla
    target_spec: Spec
    feature_off: 'Permit is a kernel policy, not WindowPermit: the clock and paidAt then gate no kernel step'
- module: spec/KamanuProbe.tla
  level: 3
  reduction: &id003
    name: ProbeOff
    spec_module: spec/MCProbe.tla
    spec: Spec
    target: spec/ladder/reduce/ProbeKernels.tla
    target_spec: PKSpec
    feature_off: 'nothing to switch: the probe is two engine profiles in lockstep, each a kernel instance'
- module: spec/MCProbe.tla
  level: 3
  reduction: *id003
- module: spec/ladder/reduce/DenySetOffDown.tla
  level: 3
  reduction: spec/ladder/reduce/DenySetOffDown.tla
- module: spec/ladder/reduce/DenySetOffUp.tla
