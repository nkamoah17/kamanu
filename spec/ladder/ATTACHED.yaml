#   evidence/ladder/r5/reductions.json)
- module: spec/ladder/split/SucceedSplit.tla
  level: 3
  reduction: spec/ladder/split/SucceedSplitFusedDown.tla
- module: spec/ladder/split/SucceedSplitFusedDown.tla
